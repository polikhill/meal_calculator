<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140910" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Раціон">
<meta name="mobile-web-app-capable" content="yes">
<title>Раціон · Carrie edition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍸%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2317090f'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle'%3E🍸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#fbf4f6;--card:#ffffff;--ink:#17090f;--muted:#6f5a63;--line:#e6d4db;--field:#fff8fa;
  --accent:#d6006f;--accent-soft:#fbe4ee;--on-accent:#ffffff;
  --k:#d6006f;--p:#b8902e;--f:#6b2d5c;--c:#17090f;--over:#b3261e;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;--body:'Jost','Helvetica Neue',Arial,sans-serif;
  --rs:4px;--rm:6px;--rl:8px;
  --cardb:1px solid var(--ink);--btnb:1px solid var(--ink);--fieldb:1px solid var(--line);
  --rule:1px solid var(--ink);--rowrule:1px solid var(--line);
  --shadow:none;--shadow-sm:none;--trackh:5px;
  --h1s:30px;--h1w:700;--h1ls:0;--h2s:20px;--h2w:700;
  --labtt:uppercase;--lables:.12em;--btntt:uppercase;--btnls:.08em;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140910;--card:#1e1118;--ink:#f6e9ef;--muted:#b394a3;--line:#3a2530;--field:#251620;
    --accent:#ff4fa3;--accent-soft:#3a1128;--on-accent:#140910;
    --k:#ff4fa3;--p:#e2c065;--f:#c77ab0;--c:#f6e9ef;--over:#ff8a80;
    --cardb:1px solid #4a3040;--btnb:1px solid #4a3040;--rule:1px solid #4a3040;
  }
}
:root[data-theme="dark"]{
  --bg:#140910;--card:#1e1118;--ink:#f6e9ef;--muted:#b394a3;--line:#3a2530;--field:#251620;
  --accent:#ff4fa3;--accent-soft:#3a1128;--on-accent:#140910;
  --k:#ff4fa3;--p:#e2c065;--f:#c77ab0;--c:#f6e9ef;--over:#ff8a80;
  --cardb:1px solid #4a3040;--btnb:1px solid #4a3040;--rule:1px solid #4a3040;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 60px}
h1{font-family:var(--display);font-size:var(--h1s,24px);font-weight:var(--h1w,700);margin:0;letter-spacing:var(--h1ls,-.01em);line-height:1.15;text-transform:var(--h1tt,none)}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.summary{position:sticky;top:0;z-index:5;background:var(--bg);margin:10px -14px 14px;padding:10px 14px 12px;border-bottom:var(--rule)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.bar .bl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px}
.bar .bl b{font-weight:600;text-transform:var(--labtt,none);letter-spacing:var(--lables,0)}
.bar .bl span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.track{height:var(--trackh,8px);border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 3px;border:var(--trackb,0)}
.fill{height:100%;border-radius:99px;transition:width .25s}
.rem{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rem.o{color:var(--over);font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.tab{border:var(--btnb);background:var(--card);color:var(--ink);border-radius:var(--rs);padding:8px 2px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);text-transform:var(--labtt,none);letter-spacing:var(--lables,0)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--card);border:var(--cardb);border-radius:var(--rl);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.meal header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
h2{font-family:var(--display);font-size:var(--h2s,18px);margin:0;font-weight:var(--h2w,700);text-transform:var(--h2tt,none);letter-spacing:var(--h2ls,0)}
h3{font-family:var(--display);font-size:16px;margin:0 0 6px;font-weight:var(--h2w,700)}
.hint{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.mt{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mt b{display:block;font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 88px 34px;gap:6px;align-items:center;padding:9px 0 7px;border-top:var(--rowrule)}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:var(--fieldb);border-radius:var(--rs);padding:8px;min-width:0;width:100%}
textarea{font-size:13px;min-height:90px;resize:vertical}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.custom-name{font-weight:600}
.custom-name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.g{display:flex;align-items:center;gap:4px}
.g input{text-align:right;padding-right:6px}
.g span{color:var(--muted);font-size:13px}
.x{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;padding:4px;cursor:pointer;border-radius:8px}
.x.sm{font-size:18px;padding:0 4px;vertical-align:middle}
.rm{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm b{color:var(--ink);font-weight:600;margin-right:4px}
.m{white-space:nowrap;margin-right:8px}
.m i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:14px;font-weight:700;border:var(--btnb);background:var(--accent-soft);color:var(--accent);border-radius:var(--rs);padding:8px 12px;cursor:pointer;box-shadow:var(--shadow-sm);text-transform:var(--btntt,none);letter-spacing:var(--btnls,0)}
.btn.solid{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted);box-shadow:none}
.btn.wide{width:100%;margin-top:10px}
.tpl{width:auto;flex:1;min-width:150px;font-size:14px}
.empty{color:var(--muted);font-size:13px;margin:8px 0 2px}
.drinksel{min-width:120px}
.drink{margin-top:12px;padding:12px;border-radius:var(--rm);background:var(--accent-soft)}
.dh{font-weight:700;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.seg button{font:inherit;font-size:13px;font-weight:700;padding:7px 4px;border-radius:var(--rs);border:var(--btnb);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.help p,.help li{font-size:14.5px;max-width:68ch}
.help p{margin:6px 0}
.help ol{padding-left:20px;margin:6px 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:600}
tr.grp td{font-weight:700;color:var(--accent);padding-top:14px}
.potin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.potin label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.out{margin-top:12px;padding:12px;border-radius:var(--rm);background:var(--accent-soft);font-variant-numeric:tabular-nums;font-size:14px}
.out .big{font-family:var(--display);font-size:18px;font-weight:600;margin-top:10px}
.warn{color:var(--over);font-weight:600;margin:8px 0 0}
.goal{margin-top:10px;border:var(--cardb);border-radius:var(--rm);background:var(--card);box-shadow:var(--shadow-sm)}
.goal summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.goal summary::-webkit-details-marker{display:none}
.goal summary::after{content:'＋';color:var(--accent);font-weight:700}
.goal[open] summary::after{content:'−'}
.goal .gbody{padding:0 12px 12px}
.goal .potin{margin-top:0}
.calc{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.calc summary{cursor:pointer;padding:6px 0;font-weight:700;font-size:14px;list-style:none;color:var(--accent)}
.calc summary::-webkit-details-marker{display:none}
.calc summary::before{content:'＋ ';}
.calc[open] summary::before{content:'− ';}
.calc .gbody{padding:6px 0 4px}
.qbtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:var(--btnb);background:var(--card);color:var(--accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px;vertical-align:middle;padding:0}
.qbtn.on{background:var(--accent);color:var(--on-accent)}
.calchelp{display:none;margin:8px 0 4px;padding:10px 12px;border-radius:var(--rm);background:var(--accent-soft);font-size:13.5px}
.calchelp.on{display:block}
.calchelp p{margin:6px 0}
.seg small{display:block;font-weight:400;font-size:11px;opacity:.85}
.sl{margin-top:12px}
.slh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:8px}
.slh span{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;white-space:nowrap}
input[type=range]{width:100%;padding:0;margin:8px 0 2px;background:transparent;border:0;accent-color:var(--accent);height:28px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.scale span:first-child{text-align:left}.scale span:last-child{text-align:right}
.scale small{font-size:10px}
.cres{margin-top:10px;font-variant-numeric:tabular-nums;font-size:14px}
.cres .cl{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.cres .cl span:last-child{white-space:nowrap}
.cres .cavg{font-weight:700}
.cres .ctd{font-family:var(--display);font-size:17px;font-weight:600;padding-top:8px}
.gnote{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.gnote.o{color:var(--over)}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:12px}
.datebar .nav{font:inherit;font-size:22px;line-height:1;border:var(--btnb);background:var(--card);color:var(--accent);border-radius:var(--rs);padding:8px 0;cursor:pointer;box-shadow:var(--shadow-sm)}
.datebar .dl{display:flex;flex-direction:column;gap:3px}
.datebar .dt{font-family:var(--display);font-weight:600;font-size:15px;text-align:center}
.datebar input{text-align:center;padding:6px}
.daylist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dayrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:var(--btnb);border-radius:var(--rm);background:var(--field);padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;box-shadow:var(--shadow-sm)}
.dayrow.cur{border-color:var(--accent)}
.dayrow .dd{font-family:var(--display);font-weight:600;font-size:15px}
.dayrow .dd small{font-family:var(--body);font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.dayrow .ds{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.dayrow .ds b{color:var(--ink)}
.nogoal{grid-column:1/-1;font-size:13px;font-variant-numeric:tabular-nums}
.nogoal b{color:var(--ink)}
.nogoal span{display:block;font-size:12px;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;gap:4px;flex-shrink:0;margin-top:4px}
.lang button{font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 7px;border:var(--btnb);background:var(--card);color:var(--ink);border-radius:var(--rs);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pick{font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:var(--fieldb);border-radius:var(--rs);padding:8px 10px;width:100%;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.panel{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;border-radius:var(--rl) var(--rl) 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.ph{display:flex;gap:6px;padding:12px 12px 8px;border-bottom:1px solid var(--line)}
.ph input{flex:1}
.plist{overflow:auto;padding:4px 12px 20px;-webkit-overflow-scrolling:touch}
.pg{font-family:var(--display);font-weight:var(--h2w,700);font-size:14px;color:var(--accent);padding:12px 0 4px}
.pi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer;text-align:left}
.pi small{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pi.on{color:var(--accent);font-weight:700}
.pempty{color:var(--muted);padding:16px 0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (max-width:380px){.bars{gap:8px 12px}.tab{font-size:11px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

h1{font-style:italic}
h1::after{content:' 🍸';font-style:normal;font-size:.7em}
.sub{font-family:var(--display);font-style:italic;font-size:14px}
h2{font-style:italic}
.card{position:relative}
.meal h2::before{content:'— ';color:var(--accent)}
.tab,.btn{font-size:11.5px}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn{background:transparent;color:var(--ink)}
.track{border-radius:0}.fill{border-radius:0}
.bar .bl b{font-size:11px}
.mt b{font-style:italic;font-size:19px}
.dayrow .dd{font-style:italic;font-size:17px}
.goal summary{text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.datebar .dt{font-style:italic;font-size:16px}
table th{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
tr.grp td{font-family:var(--display);font-style:italic;font-size:15px;color:var(--ink)}
.foot{font-family:var(--display);font-style:italic}

</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="h1">Конструктор раціону</h1>
  <div class="lang" role="group" aria-label="Language"><button data-act="lang" data-l="uk">UA</button><button data-act="lang" data-l="en">EN</button><button data-act="lang" data-l="pt">PT</button></div></div>
  <p class="sub" id="sub"></p>
  <details class="goal" id="goal">
    <summary id="goalsum">Моя ціль</summary>
    <div class="gbody">
      <div class="potin">
        <label id="gl-k">Калорії, ккал<input type="text" inputmode="decimal" data-act="goal" data-k="k" id="gk"></label>
        <label id="gl-p">Білки, г<input type="text" inputmode="decimal" data-act="goal" data-k="p" id="gp"></label>
        <label id="gl-f">Жири, г<input type="text" inputmode="decimal" data-act="goal" data-k="f" id="gf"></label>
        <label id="gl-c">Вуглеводи (залишок)<input type="text" readonly id="gc" tabindex="-1"></label>
      </div>
      <p class="gnote" id="gnote"></p>
      <div class="actions"><button class="btn ghost" data-act="goalreset">Очистити ціль</button></div>
      <details class="calc" id="calc"><summary id="calcsum">Розрахувати норму калорій</summary>
        <div class="gbody" id="calcbody"></div>
      </details>
    </div>
  </details>
  <div class="summary">
    <div class="bars" id="bars"></div>
    <div class="tabs">
      <button class="tab" data-view="day">День</button>
      <button class="tab" data-view="days">Дні</button>
      <button class="tab" data-view="pot">Каструля</button>
      <button class="tab" data-view="prod">Продукти</button>
      <button class="tab" data-view="help">Поради</button>
    </div>
  </div>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>

const GROUPS={"g0": {"uk": "Білок", "en": "Protein", "pt": "Proteína"}, "g1": {"uk": "Сири й молоко", "en": "Cheese & milk", "pt": "Queijos e leite"}, "g2": {"uk": "Крупи й хліб", "en": "Grains & bread", "pt": "Cereais e pão"}, "g3": {"uk": "Овочі", "en": "Vegetables", "pt": "Legumes"}, "g4": {"uk": "Фрукти", "en": "Fruit", "pt": "Fruta"}, "g5": {"uk": "Жири й горіхи", "en": "Fats & nuts", "pt": "Gorduras e frutos secos"}, "g6": {"uk": "Соуси й маринади", "en": "Sauces & marinades", "pt": "Molhos e marinadas"}, "g7": {"uk": "Солодке й напої", "en": "Sweets & drinks", "pt": "Doces e bebidas"}, "g8": {"uk": "Готові страви", "en": "Ready dishes", "pt": "Pratos prontos"}, "g9": {"uk": "Напої", "en": "Drinks", "pt": "Bebidas"}, "mine": {"uk": "Мої продукти", "en": "My foods", "pt": "Os meus alimentos"}};
const HELP_T={"uk": "\n<section class=\"card help\"><h3>Як користуватися</h3>\n<ol><li>На вкладці «День» обери дату (стрілки або календар), потім у кожному прийомі їжі обери шаблон або додай продукти.</li>\n<li>Підкрути грами: смужки вгорі одразу показують, скільки лишилось до плану.</li>\n<li>Усі заповнені дні збираються на вкладці «Дні». Натисни на день, щоб відкрити й відредагувати його.</li></ol></section>\n<section class=\"card help\"><h3>Сире чи готове</h3>\n<p>М'ясо, рибу й крупи найточніше зважувати сирими або сухими: вага після приготування сильно залежить від часу й способу. Якщо зважила вже готове, обирай пункти «готова» або «варені».</p>\n<p>Приблизно: крупи після варіння важать у 2,5–3 рази більше, ніж сухі, а курка й риба втрачають 20–30% ваги.</p></section>\n<section class=\"card help\"><h3>☕ Капучино або матча лате</h3>\n<p>100 мл молока 1,5–1,8% дають ≈ 47 ккал (Б 3,3, Ж 1,6, В 4,9), молоко 3,5% ≈ 64 ккал. Матча додає ще ≈ 6 ккал, еспресо майже нічого. Цукор чи сироп рахуй окремо: 1 ч. л. цукру ≈ 20 ккал.</p>\n<p>Як вписувати: напої є в переліку продуктів у групі «Напої»: додай «Капучино» або «Матча лате» в будь-який прийом їжі і вкажи мілілітри. Це лише 2–3% денного плану, тому достатньо зробити перекус трохи меншим. У дні без напою з'являється запас ≈ 50–60 ккал: жменька ягід або кілька грамів олії.</p></section>\n<section class=\"card help\"><h3>🥢 Страви на кількох</h3>\n<p>Коли страва готується на кількох, рахуй її цілою, а потім бери свою частку:</p>\n<ol><li>Один раз зваж порожню каструлю чи сковорідку й запам'ятай цифру.</li>\n<li>Зваж усе, що йде всередину: рис сухим, фарш сирим, капусту, соуси й особливо олії.</li>\n<li>Коли страва готова, зваж її разом з посудом.</li>\n<li>Зваж свою порцію на тарілці.</li></ol>\n<p>Вкладка «Каструля» порахує решту.</p>\n<p><b>Найбільше важать олії.</b> 1 ст. л. кунжутної чи рослинної олії ≈ 120 ккал, гострої олії ≈ 100 ккал. Гочуджанг дає ≈ 45 ккал на 1 ст. л., цукор чи мед у маринаді 40–60 ккал. Соєвий соус дає лише ≈ 8 ккал на 1 ст. л., зате багато солі.</p>\n<p>Якщо зважити не вийшло, бери шаблон без зважування (≈ 150 ккал на 100 г).</p></section>\n<section class=\"card help\"><h3>Орієнтир на день</h3>\n<div class=\"tbl\"><table><thead><tr><th>@@meal@@</th><th>@@kcal_l@@</th><th>@@protein@@</th></tr></thead><tbody>\n@@GUIDE@@</tbody></table></div>\n<p>Два яйця вранці вже дають ≈ 10 г жиру. Решту жирів зручно добирати авокадо, оливками, горіхами й олією, а вуглеводи — крупами, хлібом і фруктами.</p></section>\n<section class=\"card help\" id=\"datacard\"><h3>Бекап і перенесення</h3>\n<p>Дані живуть у пам'яті цього браузера. Щоб перенести їх на інший пристрій або зберегти на всяк випадок, скопіюй текст нижче й встав його там через «Імпортувати».</p>\n<div class=\"actions\"><button class=\"btn\" data-act=\"exp\">Показати мої дані</button><button class=\"btn\" data-act=\"copy\">Скопіювати</button></div>\n<textarea id=\"dataio\" placeholder=\"Сюди можна вставити збережені дані з іншого пристрою\" spellcheck=\"false\"></textarea>\n<div class=\"actions\"><button class=\"btn solid\" data-act=\"imp\">Імпортувати</button></div>\n<p class=\"hint\" id=\"datamsg\"></p></section>\n<section class=\"card help\"><h3>Про цифри</h3>\n<p>Показники на 100 г усереднені. Вуглеводи вказані без клітковини, як на європейських етикетках. Якщо на упаковці твого продукту інші цифри, додай його у вкладці «Продукти».</p>\n<p>Ціль по вуглеводах рахується як залишок: калорії − (білки × 4 + жири × 9). Змінюєш калорії, білки чи жири, і вуглеводи в цілі перераховуються самі.</p></section>", "en": "\n<section class=\"card help\"><h3>How to use</h3>\n<ol><li>On the \"Day\" tab pick a date (arrows or calendar), then in each meal pick a template or add foods.</li>\n<li>Adjust the grams: the bars at the top show right away how much is left to your goal.</li>\n<li>All logged days are collected on the \"Days\" tab. Tap a day to open and edit it.</li></ol></section>\n<section class=\"card help\"><h3>Raw or cooked</h3>\n<p>Meat, fish and grains are most accurate weighed raw or dry: cooked weight depends a lot on time and method. If you weighed it cooked, choose the \"cooked\" entries.</p>\n<p>Roughly: grains weigh 2.5–3 times more after boiling than dry, and chicken and fish lose 20–30% of their weight.</p></section>\n<section class=\"card help\"><h3>☕ Cappuccino or matcha latte</h3>\n<p>100 ml of 1.5–1.8% milk is ≈ 47 kcal (P 3.3, F 1.6, C 4.9), 3.5% milk ≈ 64 kcal. Matcha adds ≈ 6 kcal, espresso almost nothing. Count sugar or syrup separately: 1 tsp of sugar ≈ 20 kcal.</p>\n<p>How to fit it in: drinks are in the food list under \"Drinks\": add \"Cappuccino\" or \"Matcha latte\" to any meal and enter the millilitres. It is only 2–3% of the daily plan, so a slightly smaller snack covers it. On days without a drink you gain ≈ 50–60 kcal: a handful of berries or a few grams of oil.</p></section>\n<section class=\"card help\"><h3>🥢 Dishes for several people</h3>\n<p>When a dish is cooked for several people, count the whole dish and then take your share:</p>\n<ol><li>Weigh the empty pot or pan once and remember the number.</li>\n<li>Weigh everything that goes in: rice dry, mince raw, cabbage, sauces and especially oils.</li>\n<li>When the dish is ready, weigh it together with the pot.</li>\n<li>Weigh your portion on the plate.</li></ol>\n<p>The \"Pot\" tab does the rest.</p>\n<p><b>Oils matter most.</b> 1 tbsp of sesame or vegetable oil ≈ 120 kcal, chili oil ≈ 100 kcal. Gochujang is ≈ 45 kcal per tbsp, sugar or honey in a marinade 40–60 kcal. Soy sauce is only ≈ 8 kcal per tbsp, but a lot of salt.</p>\n<p>If you could not weigh it, use the no-weighing template (≈ 150 kcal per 100 g).</p></section>\n<section class=\"card help\"><h3>Daily guide</h3>\n<div class=\"tbl\"><table><thead><tr><th>@@meal@@</th><th>@@kcal_l@@</th><th>@@protein@@</th></tr></thead><tbody>\n@@GUIDE@@</tbody></table></div>\n<p>Two eggs in the morning already give ≈ 10 g of fat. The rest of the fat is easy to get from avocado, olives, nuts and oil, and carbs from grains, bread and fruit.</p></section>\n<section class=\"card help\" id=\"datacard\"><h3>Backup and transfer</h3>\n<p>Data lives in this browser's storage. To move it to another device or keep a copy, copy the text below and paste it there via \"Import\".</p>\n<div class=\"actions\"><button class=\"btn\" data-act=\"exp\">Show my data</button><button class=\"btn\" data-act=\"copy\">Copy</button></div>\n<textarea id=\"dataio\" placeholder=\"Paste saved data from another device here\" spellcheck=\"false\"></textarea>\n<div class=\"actions\"><button class=\"btn solid\" data-act=\"imp\">Import</button></div>\n<p class=\"hint\" id=\"datamsg\"></p></section>\n<section class=\"card help\"><h3>About the numbers</h3>\n<p>Values per 100 g are averages. Carbs are given without fibre, as on European labels. If your product's label says otherwise, add it on the \"Foods\" tab.</p>\n<p>The carb goal is the remainder: calories − (protein × 4 + fat × 9). Change calories, protein or fat and the carb goal updates by itself.</p></section>", "pt": "\n<section class=\"card help\"><h3>Como usar</h3>\n<ol><li>No separador «Dia» escolhe a data (setas ou calendário) e, em cada refeição, escolhe um modelo ou adiciona alimentos.</li>\n<li>Ajusta as gramas: as barras no topo mostram logo quanto falta para o objetivo.</li>\n<li>Todos os dias registados ficam no separador «Dias». Toca num dia para o abrir e editar.</li></ol></section>\n<section class=\"card help\"><h3>Cru ou cozinhado</h3>\n<p>Carne, peixe e cereais pesam-se com mais precisão crus ou secos: o peso depois de cozinhar depende muito do tempo e do método. Se pesaste já cozinhado, escolhe as opções «cozinhado» ou «cozido».</p>\n<p>Aproximadamente: os cereais pesam 2,5–3 vezes mais depois de cozidos do que secos, e o frango e o peixe perdem 20–30% do peso.</p></section>\n<section class=\"card help\"><h3>☕ Cappuccino ou matcha latte</h3>\n<p>100 ml de leite meio-gordo dão ≈ 47 kcal (P 3,3, G 1,6, HC 4,9), leite gordo ≈ 64 kcal. O matcha acrescenta ≈ 6 kcal, o expresso quase nada. Açúcar ou xarope contam-se à parte: 1 c. chá de açúcar ≈ 20 kcal.</p>\n<p>Como encaixar: as bebidas estão na lista de alimentos, no grupo «Bebidas»: adiciona «Cappuccino» ou «Matcha latte» a qualquer refeição e indica os mililitros. São só 2–3% do plano diário, por isso basta um lanche um pouco mais pequeno. Nos dias sem bebida sobram ≈ 50–60 kcal: um punhado de frutos vermelhos ou uns gramas de azeite.</p></section>\n<section class=\"card help\"><h3>🥢 Pratos para várias pessoas</h3>\n<p>Quando o prato é feito para várias pessoas, conta o prato inteiro e depois tira a tua parte:</p>\n<ol><li>Pesa uma vez a panela ou frigideira vazia e guarda o número.</li>\n<li>Pesa tudo o que vai para dentro: arroz seco, carne picada crua, couve, molhos e sobretudo óleos.</li>\n<li>Quando o prato estiver pronto, pesa-o junto com a panela.</li>\n<li>Pesa a tua porção no prato.</li></ol>\n<p>O separador «Panela» faz o resto.</p>\n<p><b>Os óleos pesam mais.</b> 1 c. sopa de óleo de sésamo ou vegetal ≈ 120 kcal, óleo picante ≈ 100 kcal. O gochujang dá ≈ 45 kcal por c. sopa, açúcar ou mel na marinada 40–60 kcal. O molho de soja dá só ≈ 8 kcal por c. sopa, mas muito sal.</p>\n<p>Se não conseguiste pesar, usa o modelo sem pesar (≈ 150 kcal por 100 g).</p></section>\n<section class=\"card help\"><h3>Referência diária</h3>\n<div class=\"tbl\"><table><thead><tr><th>@@meal@@</th><th>@@kcal_l@@</th><th>@@protein@@</th></tr></thead><tbody>\n@@GUIDE@@</tbody></table></div>\n<p>Dois ovos de manhã já dão ≈ 10 g de gordura. O resto da gordura vem bem de abacate, azeitonas, frutos secos e azeite, e os hidratos de cereais, pão e fruta.</p></section>\n<section class=\"card help\" id=\"datacard\"><h3>Cópia de segurança e transferência</h3>\n<p>Os dados ficam na memória deste browser. Para os passar para outro dispositivo ou guardar uma cópia, copia o texto abaixo e cola-o lá em «Importar».</p>\n<div class=\"actions\"><button class=\"btn\" data-act=\"exp\">Mostrar os meus dados</button><button class=\"btn\" data-act=\"copy\">Copiar</button></div>\n<textarea id=\"dataio\" placeholder=\"Cola aqui os dados guardados noutro dispositivo\" spellcheck=\"false\"></textarea>\n<div class=\"actions\"><button class=\"btn solid\" data-act=\"imp\">Importar</button></div>\n<p class=\"hint\" id=\"datamsg\"></p></section>\n<section class=\"card help\"><h3>Sobre os números</h3>\n<p>Os valores por 100 g são médias. Os hidratos são indicados sem fibra, como nos rótulos europeus. Se o rótulo do teu produto disser outra coisa, adiciona-o no separador «Alimentos».</p>\n<p>O objetivo de hidratos é o restante: calorias − (proteínas × 4 + gorduras × 9). Alteras calorias, proteínas ou gorduras e o objetivo de hidratos atualiza-se sozinho.</p></section>"};
const CALC_HELP={"uk": "<p><b>BMR</b> (базовий обмін) — це скільки калорій тіло витрачає в повному спокої за добу: на дихання, серце, температуру, роботу органів. Калькулятор рахує його трьома формулами й бере середнє, бо кожна формула дає трохи різний результат.</p>\n<p><b>1. Харріс-Бенедикт (1919)</b><br>Жінки: 655,1 + 9,6 × вага + 1,85 × зріст − 4,68 × вік<br>Чоловіки: 66,47 + 13,75 × вага + 5,0 × зріст − 6,74 × вік</p>\n<p><b>2. Міффлін-Сан Жеор (1990)</b><br>Жінки: 9,99 × вага + 6,25 × зріст − 4,92 × вік − 161<br>Чоловіки: 9,99 × вага + 6,25 × зріст − 4,92 × вік + 5</p>\n<p><b>3. Харріс-Бенедикт, переглянута (1984)</b><br>Жінки: 447,6 + 9,2 × вага + 3,1 × зріст − 4,3 × вік<br>Чоловіки: 88,36 + 13,4 × вага + 4,8 × зріст − 5,68 × вік</p>\n<p>Вага в кг, зріст у см, вік у роках. Середнє = (1 + 2 + 3) ÷ 3.</p>\n<p><b>Норма з урахуванням активності</b> = середній BMR × коефіцієнт: 1,2 сидячий спосіб життя, 1,375 легкі тренування 1–3 рази на тиждень, 1,55 середні 3–5 разів, 1,725 інтенсивні 6–7 разів, 1,9 фізична робота плюс тренування. Результат округлюється до 10 ккал.</p>\n<p>Це кількість калорій для підтримання ваги. Щоб худнути, зазвичай віднімають 10–20%, щоб набирати, додають. Формули дають орієнтир з похибкою близько ±10%, тому за 2–3 тижні варто звірити з реальною динамікою ваги.</p>\n<p><b>Білки</b> рахуються від ваги: 0,8 г/кг без активності, 1,2–1,6 г/кг при середній, 2 г/кг для спортсменів. Калькулятор підбирає значення за обраною активністю, але його можна змінити.</p>\n<p><b>Жири</b>: мінімум 0,6–0,8 г/кг (радять при ожирінні), середня норма 1 г/кг, максимум 2 г/кг лише для професійних спортсменів. Майже всі олії багаті на омега-6; правильне співвідношення омега-6 до омега-3 — 2:1.</p>\n<p><b>Вуглеводи</b> — усе, що лишилось: (калорії − білки × 4 − жири × 9) ÷ 4.</p>", "en": "<p><b>BMR</b> (basal metabolic rate) is how many calories your body burns per day at complete rest: breathing, heartbeat, temperature, organ function. The calculator uses three formulas and averages them, because each gives a slightly different result.</p>\n<p><b>1. Harris-Benedict (1919)</b><br>Women: 655.1 + 9.6 × weight + 1.85 × height − 4.68 × age<br>Men: 66.47 + 13.75 × weight + 5.0 × height − 6.74 × age</p>\n<p><b>2. Mifflin-St Jeor (1990)</b><br>Women: 9.99 × weight + 6.25 × height − 4.92 × age − 161<br>Men: 9.99 × weight + 6.25 × height − 4.92 × age + 5</p>\n<p><b>3. Harris-Benedict, revised (1984)</b><br>Women: 447.6 + 9.2 × weight + 3.1 × height − 4.3 × age<br>Men: 88.36 + 13.4 × weight + 4.8 × height − 5.68 × age</p>\n<p>Weight in kg, height in cm, age in years. Average = (1 + 2 + 3) ÷ 3.</p>\n<p><b>Daily needs with activity</b> = average BMR × factor: 1.2 sedentary, 1.375 light exercise 1–3 times a week, 1.55 moderate 3–5 times, 1.725 intense 6–7 times, 1.9 physical job plus training. The result is rounded to 10 kcal.</p>\n<p>This is the amount for maintaining weight. To lose weight people usually subtract 10–20%, to gain they add. The formulas are an estimate with roughly ±10% error, so check against your real weight trend after 2–3 weeks.</p>\n<p><b>Protein</b> is based on body weight: 0.8 g/kg with no activity, 1.2–1.6 g/kg with moderate activity, 2 g/kg for athletes. The calculator picks a value from your activity level, but you can change it.</p>\n<p><b>Fat</b>: minimum 0.6–0.8 g/kg (advised for obesity), average 1 g/kg, maximum 2 g/kg only for professional athletes. Almost all oils are rich in omega-6; the right omega-6 to omega-3 ratio is 2:1.</p>\n<p><b>Carbs</b> are the remainder: (calories − protein × 4 − fat × 9) ÷ 4.</p>", "pt": "<p><b>BMR</b> (metabolismo basal) é quantas calorias o corpo gasta por dia em repouso total: respiração, coração, temperatura, órgãos. A calculadora usa três fórmulas e faz a média, porque cada uma dá um resultado ligeiramente diferente.</p>\n<p><b>1. Harris-Benedict (1919)</b><br>Mulheres: 655,1 + 9,6 × peso + 1,85 × altura − 4,68 × idade<br>Homens: 66,47 + 13,75 × peso + 5,0 × altura − 6,74 × idade</p>\n<p><b>2. Mifflin-St Jeor (1990)</b><br>Mulheres: 9,99 × peso + 6,25 × altura − 4,92 × idade − 161<br>Homens: 9,99 × peso + 6,25 × altura − 4,92 × idade + 5</p>\n<p><b>3. Harris-Benedict, revista (1984)</b><br>Mulheres: 447,6 + 9,2 × peso + 3,1 × altura − 4,3 × idade<br>Homens: 88,36 + 13,4 × peso + 4,8 × altura − 5,68 × idade</p>\n<p>Peso em kg, altura em cm, idade em anos. Média = (1 + 2 + 3) ÷ 3.</p>\n<p><b>Necessidade diária com atividade</b> = BMR médio × fator: 1,2 sedentário, 1,375 exercício leve 1–3 vezes por semana, 1,55 moderado 3–5 vezes, 1,725 intenso 6–7 vezes, 1,9 trabalho físico mais treino. O resultado é arredondado a 10 kcal.</p>\n<p>É a quantidade para manter o peso. Para perder peso costuma-se retirar 10–20%, para ganhar acrescenta-se. As fórmulas são uma estimativa com cerca de ±10% de erro, por isso convém comparar com a evolução real do peso ao fim de 2–3 semanas.</p>\n<p><b>Proteínas</b> calculam-se pelo peso: 0,8 g/kg sem atividade, 1,2–1,6 g/kg com atividade moderada, 2 g/kg para atletas. A calculadora escolhe o valor pela atividade indicada, mas podes alterá-lo.</p>\n<p><b>Gorduras</b>: mínimo 0,6–0,8 g/kg (aconselhado em caso de obesidade), média 1 g/kg, máximo 2 g/kg só para atletas profissionais. Quase todos os óleos são ricos em ómega-6; a proporção certa de ómega-6 para ómega-3 é 2:1.</p>\n<p><b>Hidratos</b> são o restante: (calorias − proteínas × 4 − gorduras × 9) ÷ 4.</p>"};

  $('[data-act="goalreset"]').textContent=t('goal_clear');$('#calcsum').textContent=t('calc_open');
  if(!$('#calcbody').dataset.lang||$('#calcbody').dataset.lang!==L()){$('#calcbody').dataset.lang=L();renderCalc(true);}
  document.querySelectorAll('.tab').forEach(b=>b.textContent=t('tab_'+b.dataset.view));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L()));
  document.documentElement.lang=L();
  if(!hasGoal()){
    $('#sub').textContent=t('goal_none');
    $('#goalsum').textContent=t('goal_set');if(!goalAutoOpened){goalAutoOpened=true;$('#goal').open=true;}
    if(gc)gc.value='';
    n.textContent=t('goal_none_note');n.classList.remove('o');
    return;
  }
  $('#goalsum').textContent=t('goal_change');
  $('#sub').textContent=t('goal_line',{k:fmt(tg.k),p:fmt(tg.p),f:fmt(tg.f),c:fmt(tg.c),ck:fmt(tg.c*4)});
  if(gc)gc.value=`${fmt(tg.c*4)} ${t('kcal')} ≈ ${fmt(tg.c)} ${t('g')}`;
  n.textContent=left>=0?t('goal_calc',{k:fmt(tg.k),p:fmt(tg.p),f:fmt(tg.f),left:fmt(left)}):t('goal_over',{n:fmt(tg.p*4+tg.f*9)});
  n.classList.toggle('o',left<0);
}
function bmr(c){
  const w=pf(c.w),h=pf(c.h),a=pf(c.a),f=c.sex==='f';
  if(!(w>0&&h>0&&a>0))return null;
  const hb=f?655.1+9.6*w+1.85*h-4.68*a:66.47+13.75*w+5.0*h-6.74*a;
  const msj=9.99*w+6.25*h-4.92*a+(f?-161:5);
  const hb2=f?447.6+9.2*w+3.1*h-4.3*a:88.36+13.4*w+4.8*h-5.68*a;
  const avg=(hb+msj+hb2)/3;
  return {hb,msj,hb2,avg,tdee:avg*pf(c.act||1.2)};
}
function calcHTML(){
  const c=state.calc,r=bmr(c);
  const acts=[['1.2','act1'],['1.375','act2'],['1.55','act3'],['1.725','act4'],['1.9','act5']];
  let res=`<p class="hint">${t('calc_fill')}</p>`;
  if(r)res=`<div class="cres">
    <div class="cl"><span>${t('f_hb')}</span><span>${fmt(r.hb)} ${t('kcal')}</span></div>
    <div class="cl"><span>${t('f_msj')}</span><span>${fmt(r.msj)} ${t('kcal')}</span></div>
    <div class="cl"><span>${t('f_hb2')}</span><span>${fmt(r.hb2)} ${t('kcal')}</span></div>
    <div class="cl cavg"><span>${t('calc_avg')} (${t('calc_bmr')})</span><span>${fmt(r.avg)} ${t('kcal')}</span></div>
    <div class="ctd">${t('calc_tdee')}: ${fmt(r10(r.tdee))} ${t('kcal')}</div>
    <p class="hint">${t('calc_note')}</p>
    <div class="seg" style="grid-template-columns:repeat(3,1fr);margin-top:8px">${[[1,'calc_maint'],[0.9,'−10%'],[0.8,'−20%']].map(([m,l])=>`<button data-act="cdef" data-m="${m}" class="${(state.calc.def||1)==m?'on':''}">${l.startsWith('calc')?t(l):l}<br><small>${fmt(r10(r.tdee*m))}</small></button>`).join('')}</div>
    ${(()=>{const c=state.calc,W=pf(c.w),k=r10(r.tdee*(c.def||1));
      const pkAuto={'1.2':0.8,'1.375':1.2,'1.55':1.4,'1.725':1.6,'1.9':2}[c.act]||1.2;
      const pk=c.pk||pkAuto,fk=c.fk||1;
      const P=Math.round(W*pk),F=Math.round(W*fk),C=Math.max(0,Math.round((k-P*4-F*9)/4));
      return `<div class="sl"><div class="slh"><b>${t('calc_prot')}</b><span id="pkval">${pk.toFixed(1).replace(".",L()==="en"?".":",")} → ${P} ${t('g')}</span></div>
        <input type="range" min="0.8" max="2" step="0.1" value="${pk}" data-act="cpk" aria-label="${t('calc_prot')}">
        <div class="scale"><span>0,8<br><small>${t('pk08')}</small></span><span>1,2–1,6<br><small>${t('pk12')}</small></span><span>2,0<br><small>${t('pk20')}</small></span></div></div>
      <div class="sl"><div class="slh"><b>${t('calc_fat')}</b><span id="fkval">${fk.toFixed(1).replace(".",L()==="en"?".":",")} → ${F} ${t('g')}</span></div>
        <input type="range" min="0.6" max="2" step="0.1" value="${fk}" data-act="cfk" aria-label="${t('calc_fat')}">
        <div class="scale"><span>0,6–0,8<br><small>${t('fk07')}</small></span><span>1,0<br><small>${t('fk10')}</small></span><span>2,0<br><small>${t('fk20')}</small></span></div></div>
      <p class="hint">${t('calc_fat_hint')} ${t('omega')}</p>
      <div class="ctd" id="macros" style="font-size:15px">${t('calc_macros',{p:P,f:F,c:C,ck:fmt(C*4)})}</div>
      <button class="btn solid wide" data-act="calcapply" data-k="${k}" data-p="${P}" data-f="${F}">${t('calc_apply2',{k:fmt(k),p:P,f:F})}</button>`;})()}</div>`;
  return `<div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:4px"><span class="hint">${t('how_calc')}</span><button class="qbtn${state.calcHelp?' on':''}" data-act="calchelp" type="button" aria-label="${t('how_calc')}" aria-expanded="${!!state.calcHelp}">?</button></div>
    <div class="calchelp${state.calcHelp?' on':''}" id="calchelp">${CALC_HELP[L()]}</div>
    <div class="seg" style="grid-template-columns:1fr 1fr"><button data-act="csex" data-v="f" class="${c.sex==='f'?'on':''}">${t('calc_f')}</button><button data-act="csex" data-v="m" class="${c.sex!=='f'?'on':''}">${t('calc_m')}</button></div>
    <div class="potin">
      <label>${t('calc_w')}<input type="text" inputmode="decimal" data-act="calc" data-k="w" value="${esc(c.w)}"></label>
      <label>${t('calc_h')}<input type="text" inputmode="decimal" data-act="calc" data-k="h" value="${esc(c.h)}"></label>
      <label>${t('calc_a')}<input type="text" inputmode="decimal" data-act="calc" data-k="a" value="${esc(c.a)}"></label>
      <label>${t('calc_act')}<select data-act="cact">${acts.map(([v,k])=>`<option value="${v}"${c.act===v?' selected':''}>${t(k)}</option>`).join('')}</select></label>
    </div><div id="cres">${res}</div>`;
}
function macroLive(){
  const c=state.calc,r=bmr(c);if(!r)return;const W=pf(c.w),k=r10(r.tdee*(c.def||1));
  const pkAuto={'1.2':0.8,'1.375':1.2,'1.55':1.4,'1.725':1.6,'1.9':2}[c.act]||1.2;const pk=c.pk||pkAuto,fk=c.fk||1;
  const P=Math.round(W*pk),F=Math.round(W*fk),C=Math.max(0,Math.round((k-P*4-F*9)/4));
  const pv=$('#pkval'),fv=$('#fkval'),m=$('#macros'),b=$('[data-act="calcapply"]');
  if(pv)pv.textContent=`${pk.toFixed(1).replace(".",L()==="en"?".":",")} → ${P} ${t('g')}`;if(fv)fv.textContent=`${fk.toFixed(1).replace(".",L()==="en"?".":",")} → ${F} ${t('g')}`;
  if(m)m.textContent=t('calc_macros',{p:P,f:F,c:C,ck:fmt(C*4)});
  if(b){b.dataset.k=k;b.dataset.p=P;b.dataset.f=F;b.textContent=t('calc_apply2',{k:fmt(k),p:P,f:F});}
}
function renderCalc(full){
  if(full){$('#calcbody').innerHTML=calcHTML();return;}
  const c=state.calc,r=bmr(c);const cr=$('#cres');if(!cr)return;
  cr.innerHTML=calcHTML().split('<div id="cres">')[1].replace(/<\/div>$/,'');
}
function fillGoalInputs(){for(const k of ['k','p','f']){const el=$('#g'+k);if(el&&document.activeElement!==el)el.value=T()[k]||'';}}
function bar(label,val,target,unit,color,extra=''){
  target=target||0;const diff=val-target,over=target>0&&diff>target*0.05;
  const txt=diff<0?t('still',{n:fmt(-diff),u:unit}):t('over',{n:fmt(diff),u:unit});
  return `<div class="bar"><div class="bl"><b>${label}</b><span>${fmt(val)} / ${fmt(target)}</span></div>
    <div class="track"><div class="fill" style="width:${target>0?Math.min(val/target*100,100):0}%;background:${over?'var(--over)':color}"></div></div>
    <div class="rem${over?' o':''}">${txt}${extra}</div></div>`;
}
function updateTotals(){
  syncC();let day=Z();const d=peek(state.date);
  for(const m of allMeals(d)){
    const tt=sum(mealRowsOf(d,m.id));day=addT(day,tt);
    const el=document.querySelector(`[data-role="mt-${m.id}"]`);
    if(el) el.innerHTML=`<b>${fmt(tt.k)} ${t('kcal')}</b>${t('P')} ${fmt(tt.p)}  ${t('F')} ${fmt(tt.f)}  ${t('C')} ${fmt(tt.c)}`;
  }
  $('#bars').innerHTML=!hasGoal()?`<div class="nogoal">${t('nogoal_bar',{k:`<b>${fmt(day.k)}</b>`,p:fmt(day.p),f:fmt(day.f),c:fmt(day.c),P:t('P'),F:t('F'),C:t('C')})}<span>${t('nogoal_bar2')}</span></div>`:
    bar(t('calories'),day.k,T().k,t('kcal'),'var(--k)')+
    bar(t('protein'),day.p,T().p,t('g'),'var(--p)')+
    bar(t('fat'),day.f,T().f,t('g'),'var(--f)')+
    bar(t('carbs'),day.c,T().c,t('g'),'var(--c)',t('of_kcal',{a:fmt(day.c*4),b:fmt(T().c*4)}));
  goalUI();
  const po=$('#potout');if(po) po.innerHTML=potOut();
}
function refreshHints(){
  document.querySelectorAll('.meal').forEach(sec=>{const m=allMeals(cur()).find(x=>x.id===sec.dataset.meal);const h=sec.querySelector('header .hint');if(m&&h)h.textContent=mealHint(m);else if(m&&mealHint(m)){const hd=sec.querySelector('header h2');if(hd)hd.insertAdjacentHTML('afterend',`<p class="hint">${mealHint(m)}</p>`);}});
  if(state.view==='help')$('#view').innerHTML=helpHTML();
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));
  const v=$('#view');
  if(state.view==='pot') v.innerHTML=potHTML();
  else if(state.view==='prod') v.innerHTML=prodHTML();
  else if(state.view==='help') v.innerHTML=helpHTML();
  else if(state.view==='days') v.innerHTML=daysHTML();
  else v.innerHTML=dayHTML();
  updateTotals();
}
let picker=null,goalAutoOpened=false;
const norm=x=>String(x).toLowerCase().replace(/[’'ʼ`]/g,'').replace(/ё/g,'е');
function openPicker(pk){
  picker=pk;let el=$('#sheet');
  if(!el){el=document.createElement('div');el.id='sheet';el.className='sheet';document.body.appendChild(el);}
  el.innerHTML=`<div class="panel" role="dialog" aria-label="${t('choose_food')}"><div class="ph"><input id="psearch" type="search" placeholder="${t('search_ph')}" autocomplete="off" autocapitalize="off"><button class="x" data-act="pclose" aria-label="${t('close')}">×</button></div><div class="plist" id="plist"></div></div>`;
  el.style.display='flex';renderPList('');
  setTimeout(()=>{const i=$('#psearch');if(i)i.focus();},60);
}
function renderPList(q){
  q=norm(q).trim();const curId=picker&&picker.mode==='set'?(listOf({dataset:picker})[picker.i]||{}).pid:null;
  const match=x=>!q||(Array.isArray(x.n)?x.n:[x.n]).some(v=>norm(v).includes(q));
  const items=allP().filter(match);
  const html=groups().map(g=>{const xs=items.filter(x=>x.g===g);if(!xs.length)return '';
    return `<div class="pg">${esc(GNAME(g))}</div>`+xs.map(x=>`<button class="pi${x.id===curId?' on':''}" data-act="pchoose" data-id="${x.id}" type="button"><span>${esc(N(x.n))}</span><small>${fmt(x.k)} ${t('kcal')}</small></button>`).join('');}).join('');
  $('#plist').innerHTML=html||`<p class="pempty">${t('nothing_found')}</p>`;
}
function closePicker(){picker=null;const el=$('#sheet');if(el)el.style.display='none';}
function choose(id){
  if(!picker)return;const pk=picker;closePicker();
  if(pk.mode==='set'){const rows=listOf({dataset:pk});const r=rows[pk.i];if(r){delete r.custom;r.pid=id;}}
  else{const rows=pk.scope==='pot'?state.pot.rows:cur().meals[pk.meal];rows.push({pid:id,g:100});}
  save();render();
}
function goTo(iso){if(!isISO(iso))return;state.date=iso;state.view='day';save();render();try{window.scrollTo({top:0});}catch(e){}}

document.addEventListener('input',e=>{
  const el=e.target,act=el.dataset&&el.dataset.act;if(!act&&el.id!=='psearch')return;
  if(act==='g'){const r=getRow(el);r.g=Math.max(0,pf(el.value));el.closest('.row').querySelector('[data-role="rm"]').innerHTML=macroLine(scaled(r));}
  else if(act==='tare'||act==='gross'||act==='portion'){state.pot[act]=Math.max(0,pf(el.value));}
  else if(el.id==='psearch'){renderPList(el.value);return;}
  else if(act==='calc'){state.calc[el.dataset.k]=el.value;save();renderCalc(false);return;}
  else if(act==='cpk'){state.calc.pk=pf(el.value);save();macroLive();return;}
  else if(act==='cfk'){state.calc.fk=pf(el.value);save();macroLive();return;}
  else if(act==='goal'){state.target[el.dataset.k]=Math.max(0,pf(el.value));save();updateTotals();refreshHints();return;}
  else return;
  save();updateTotals();
});
document.addEventListener('change',e=>{
  const el=e.target,act=el.dataset&&el.dataset.act;if(!act)return;
  if(act==='tpl'){if(!el.value)return;cur().meals[el.dataset.meal]=tplRows(el.value);save();render();return;}
  else if(act==='potto'){state.pot.to=el.value;}
  else if(act==='cact'){state.calc.act=el.value;state.calc.pk=null;save();renderCalc(false);return;}
  else if(act==='date'){goTo(el.value);return;}
  else return;
  save();updateTotals();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&picker){closePicker();return;}if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('dayrow'))e.target.click();});
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closePicker();return;}
  const tab=e.target.closest('.tab');
  if(tab){state.view=tab.dataset.view;save();render();return;}
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  const act=el.dataset.act;let scrollTo=null;
  if(act==='add'){openPicker({mode:'add',scope:el.dataset.scope||'meal',meal:el.dataset.meal||''});return;}
  else if(act==='pick'){const r=el.closest('.row');openPicker({mode:'set',scope:r.dataset.scope,meal:r.dataset.meal,i:+r.dataset.i});return;}
  else if(act==='pchoose'){choose(el.dataset.id);return;}
  else if(act==='pclose'){closePicker();return;}
  else if(act==='del'){const r=el.closest('.row');listOf(r).splice(+r.dataset.i,1);}
  else if(act==='clear'){if(el.dataset.scope==='pot')state.pot.rows=[];else cur().meals[el.dataset.meal]=[];}
  else if(act==='addmeal'){const n=(prompt(t('meal_name_q'),t('meal_default'))||'').trim();if(!n)return;const id='x'+Date.now();const d=cur();d.extra.push({id,name:n});d.meals[id]=[];scrollTo=id;}
  else if(act==='renmeal'){const d=cur(),e=d.extra.find(x=>x.id===el.dataset.meal);if(!e)return;const n=(prompt(t('meal_name_q'),e.name)||'').trim();if(!n)return;e.name=n;}
  else if(act==='delmeal'){const d=cur(),e=d.extra.find(x=>x.id===el.dataset.meal);if(!e)return;if(mealRowsOf(d,e.id).length&&!confirm(t('confirm_del_meal',{n:e.name})))return;d.extra=d.extra.filter(x=>x.id!==e.id);delete d.meals[e.id];}
  else if(act==='pottpl'){state.pot.rows=potDefault();state.pot.tare=0;state.pot.gross=1310;}
  else if(act==='potadd'){
    const p=state.pot,net=Math.max(0,(+p.gross||0)-(+p.tare||0));
    if(!net||!p.rows.length||!p.portion){const o=$('#potout');if(o)o.insertAdjacentHTML('beforeend',`<p class="warn">${t('pot_warn')}</p>`);return;}
    const tt=scale(sum(p.rows),100/net);
    if(!cur().meals[p.to])p.to='dinner';cur().meals[p.to].push({custom:{pot:true,n:'Страва з каструлі',k:tt.k,p:tt.p,f:tt.f,c:tt.c},g:+p.portion});
    state.view='day';scrollTo=p.to;
  }
  else if(act==='addmine'){
    const n=$('#mn').value.trim(),num=id=>pf($(id).value);
    let k=num('#mk');const pp=num('#mp'),ff=num('#mf'),cc=num('#mc');
    if(!n){$('#mmsg').textContent=t('err_name');return;}
    if(!k)k=pp*4+ff*9+cc*4;
    if(!k){$('#mmsg').textContent=t('err_vals');return;}
    state.mine.push({id:'u'+Date.now(),g:'mine',n,k,p:pp,f:ff,c:cc,mine:true});
  }
  else if(act==='delmine'){
    const id=el.dataset.id,pr=byId(id);if(!pr)return;
    const conv=rows=>rows.forEach(r=>{if(r.pid===id){r.custom={n:N(pr.n),k:pr.k,p:pr.p,f:pr.f,c:pr.c};delete r.pid;}});
    Object.values(state.days).forEach(d=>Object.values(d.meals).forEach(conv));conv(state.pot.rows);
    state.mine=state.mine.filter(x=>x.id!==id);
  }
  else if(act==='goalreset'){state.target={...DEFAULT_TARGET};}
  else if(act==='calchelp'){state.calcHelp=!state.calcHelp;el.classList.toggle('on',state.calcHelp);el.setAttribute('aria-expanded',String(!!state.calcHelp));$('#calchelp').classList.toggle('on',state.calcHelp);return;}
  else if(act==='cdef'){state.calc.def=pf(el.dataset.m);save();renderCalc(false);return;}
  else if(act==='csex'){state.calc.sex=el.dataset.v;save();renderCalc(true);return;}
  else if(act==='calcapply'){state.target.k=pf(el.dataset.k);state.target.p=pf(el.dataset.p);state.target.f=pf(el.dataset.f);$('#calc').open=false;}
  else if(act==='lang'){state.lang=el.dataset.l;}
  else if(act==='dprev'){goTo(shiftISO(state.date,-1));return;}
  else if(act==='dnext'){goTo(shiftISO(state.date,1));return;}
  else if(act==='today'){goTo(todayISO());return;}
  else if(act==='open'){goTo(el.dataset.d);return;}
  else if(act==='newday'){const b=$('#newdaybox');b.style.display=b.style.display==='none'?'block':'none';return;}
  else if(act==='opennew'){goTo($('#newdate').value);return;}
  else if(act==='deld'){e.stopPropagation();const k=el.dataset.d;if(!confirm(t('confirm_del_day',{d:fmtDate(k)})))return;delete state.days[k];}
  else if(act==='cleardaybtn'){if(!confirm(t('confirm_clear_day',{d:fmtDate(state.date)})))return;delete state.days[state.date];}
  else if(act==='exp'){$('#dataio').value=JSON.stringify(state);$('#datamsg').textContent=t('exp_msg');return;}
  else if(act==='copy'){const ta=$('#dataio');if(!ta.value)ta.value=JSON.stringify(state);ta.select();
    const done=()=>{$('#datamsg').textContent=t('copied');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done,()=>{document.execCommand&&document.execCommand('copy');done();});
    else{document.execCommand&&document.execCommand('copy');done();}
    return;}
  else if(act==='imp'){
    let d;try{d=JSON.parse($('#dataio').value);}catch(e){$('#datamsg').textContent=t('imp_err');return;}
    if(!d||typeof d!=='object'||!d.target){$('#datamsg').textContent=t('imp_bad');return;}
    if(!confirm(t('imp_confirm')))return;
    state=merge(d);save();render();fillGoalInputs();$('#datamsg').textContent=t('imp_ok');return;}
  else return;
  save();render();fillGoalInputs();
  if(scrollTo){const s=document.querySelector(`.meal[data-meal="${scrollTo}"]`);if(s&&s.scrollIntoView)s.scrollIntoView({block:"start"});}
});
render();fillGoalInputs();
