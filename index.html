<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140910" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Раціон">
<meta name="mobile-web-app-capable" content="yes">
<title>Раціон · Carrie edition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍸%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2317090f'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle'%3E🍸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top"><h1 id="h1">Конструктор раціону</h1>
  <div class="lang" role="group" aria-label="Language"><button data-act="lang" data-l="uk">UA</button><button data-act="lang" data-l="en">EN</button><button data-act="lang" data-l="pt">PT</button></div></div>
  <p class="sub" id="sub"></p>
  <details class="goal" id="goal">
    <summary id="goalsum">Моя ціль</summary>
    <div class="gbody">
      <div class="potin">
        <label id="gl-k">Калорії, ккал<input type="text" inputmode="decimal" data-act="goal" data-k="k" id="gk"></label>
        <label id="gl-p">Білки, г<input type="text" inputmode="decimal" data-act="goal" data-k="p" id="gp"></label>
        <label id="gl-f">Жири, г<input type="text" inputmode="decimal" data-act="goal" data-k="f" id="gf"></label>
        <label id="gl-c">Вуглеводи (залишок)<input type="text" readonly id="gc" tabindex="-1"></label>
      </div>
      <p class="gnote" id="gnote"></p>
      <div class="actions"><button class="btn ghost" data-act="goalreset">Очистити ціль</button></div>
      <details class="calc" id="calc"><summary id="calcsum">Розрахувати норму калорій</summary>
        <div class="gbody" id="calcbody"></div>
      </details>
    </div>
  </details>
  <div class="summary">
    <div class="bars" id="bars"></div>
    <div class="tabs">
      <button class="tab" data-view="day">День</button>
      <button class="tab" data-view="days">Дні</button>
      <button class="tab" data-view="pot">Каструля</button>
      <button class="tab" data-view="prod">Продукти</button>
      <button class="tab" data-view="help">Поради</button>
    </div>
  </div>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
